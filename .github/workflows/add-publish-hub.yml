name: Add owner publishing hub

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-publish-hub.yml'

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enhance owner publishing experience
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'PUBLISH-HUB' not in s:
              css = '''
    /* PUBLISH-HUB */
    .publish-hub{padding:34px 0 76px}.publish-shell{position:relative;overflow:hidden;border:1px solid rgba(215,179,106,.24);border-radius:32px;background:linear-gradient(135deg,rgba(215,179,106,.14),rgba(17,31,43,.94) 55%,rgba(37,211,102,.05));padding:34px;box-shadow:var(--shadow)}.publish-shell:after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:rgba(215,179,106,.08);filter:blur(18px);left:-150px;bottom:-180px}.publish-grid{display:grid;grid-template-columns:.95fr 1.05fr;gap:28px;align-items:center;position:relative;z-index:2}.publish-badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(215,179,106,.25);background:rgba(7,16,23,.45);color:var(--gold2);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700}.publish-shell h2{font-size:clamp(32px,4.5vw,52px);line-height:1.15;margin:13px 0 10px}.publish-shell p{color:var(--muted);margin:0;max-width:650px}.publish-features{display:grid;grid-template-columns:1fr 1fr;gap:11px}.publish-feature{border:1px solid rgba(255,255,255,.08);background:rgba(7,16,23,.5);border-radius:18px;padding:16px}.publish-feature b{display:block;color:#fff;margin-bottom:3px}.publish-feature span{font-size:12px;color:var(--muted)}.publish-num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:rgba(215,179,106,.11);color:var(--gold2);border:1px solid rgba(215,179,106,.2);font-size:12px;margin-bottom:9px}.publish-note{margin-top:13px;font-size:12px;color:var(--muted)}
    @media(max-width:900px){.publish-grid{grid-template-columns:1fr}.publish-features{grid-template-columns:1fr 1fr}}@media(max-width:600px){.publish-shell{padding:24px}.publish-features{grid-template-columns:1fr}.publish-hub{padding-top:12px}}
'''
              s = s.replace('</style>', css + '\n  </style>', 1)
              s = s.replace('<a href="#owner">اعرض عقارك</a>', '<a href="#publish">انشر عقارك</a>', 1)
              hero_old = '<a class="btn btn-outline" href="#properties">استعرض العقارات</a>'
              hero_new = '<a class="btn btn-outline" href="#properties">استعرض العقارات</a><a class="btn btn-outline" href="#publish">انشر عقارك معنا</a>'
              s = s.replace(hero_old, hero_new, 1)
              service_old = '<article class="card"><div class="card-icon">⌂</div><h3>تسويق عروض الملاك</h3><p>استقبال بيانات العقار الأساسية وتنظيمها بصيغة واضحة تساعد على تقديم العرض بشكل احترافي.</p></article>'
              service_new = '<article class="card"><div class="card-icon">⌂</div><h3>نشر وتسويق عقارك</h3><p>نرتب بيانات عقارك، نصيغ العرض بشكل احترافي، ونجهزه للنشر والمشاركة مع العملاء المهتمين.</p></article>'
              s = s.replace(service_old, service_new, 1)
              section = '''
<section id="publish" class="publish-hub"><div class="wrap"><div class="publish-shell"><div class="publish-grid">
  <div><span class="publish-badge">✦ خدمة الملاك</span><h2>نساعدك في <span class="gradient-text">نشر عقارك</span></h2><p>بدل ما تتعب في ترتيب الإعلان من الصفر، أرسل لنا بيانات العقار ونساعدك في تحويلها إلى عرض واضح واحترافي يسهل مشاركته والوصول به للعملاء المناسبين.</p><div class="actions"><a class="btn btn-gold" href="#owner">أرسل عقارك للنشر</a><a class="btn btn-outline" href="https://wa.me/966544986631?text=%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85%20%D8%B9%D9%84%D9%8A%D9%83%D9%85%D8%8C%20%D8%A3%D8%B1%D8%BA%D8%A8%20%D9%81%D9%8A%20%D9%86%D8%B4%D8%B1%20%D8%B9%D9%82%D8%A7%D8%B1%D9%8A" target="_blank" rel="noopener">واتساب سريع</a></div><div class="publish-note">نراجع بيانات العقار وترخيص الإعلان قبل نشر أي عرض.</div></div>
  <div class="publish-features"><div class="publish-feature"><span class="publish-num">01</span><b>صياغة الإعلان</b><span>عنوان ووصف مرتب يوضح أهم مزايا العقار بسرعة.</span></div><div class="publish-feature"><span class="publish-num">02</span><b>تجهيز العرض</b><span>ترتيب السعر والمساحة والموقع والمواصفات بصورة احترافية.</span></div><div class="publish-feature"><span class="publish-num">03</span><b>رابط قابل للمشاركة</b><span>يمكن تجهيز عرض داخل الموقع يسهل إرساله للمهتمين عبر واتساب.</span></div><div class="publish-feature"><span class="publish-num">04</span><b>فرز الاستفسارات</b><span>تواصل مباشر يساعد على التركيز على العملاء الأكثر جدية.</span></div></div>
</div></div></div></section>
'''
              s = s.replace('<section id="properties">', section + '\n<section id="properties">', 1)
              s = s.replace('<h2 class="title">اعرض عقارك بطريقة منظمة</h2><p class="sub">أدخل أهم البيانات، وسيتم تجهيز رسالة واتساب كاملة بدل إرسال المعلومات بشكل متفرق.</p>', '<h2 class="title">أرسل عقارك للنشر</h2><p class="sub">أدخل البيانات الأساسية وسنستلمها بصيغة مرتبة تساعدنا في تجهيز عرض عقارك وتسويقه بشكل أوضح.</p>', 1)
              s = s.replace('السلام عليكم، أرغب في عرض عقاري', 'السلام عليكم، أرغب في نشر وتسويق عقاري', 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html
            git commit -m "Add professional owner publishing hub"
            git push
          fi